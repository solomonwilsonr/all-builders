[project]
name = "safeshelf-api"
version = "0.1.0"
description = "SafeShelf API (M7): the single front door for screens, agents and bots"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "google-genai>=1.0",  # engine/ (real handlers)
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "pillow>=10",
    "imagehash>=4.3",
    "mcp>=2.3",  # /mcp (app/mcp_server.py), MCPServer API
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
