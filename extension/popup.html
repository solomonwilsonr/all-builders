<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeShelf</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card">
  <div class="brand-row"><span class="mark" aria-hidden="true">✦</span><span class="brand">SafeShelf</span><span class="badge">AI</span></div>
  <h1>Check before you buy.</h1>
  <p class="lede">Safety and genuineness checks on the products you shop for.</p>
  <button id="check" type="button" class="primary big">Check this page</button>
  <p id="check-hint" class="hint" role="status">Works on product pages on Amazon (India, Japan, Australia, Singapore, US) and Flipkart.</p>
  <ul>
    <li><button id="power" type="button" role="switch" aria-checked="true" class="row"><span id="power-label">SafeShelf is on</span><span id="power-state" class="state">On</span></button></li>
    <li><button id="guard" type="button" role="switch" aria-checked="true" class="row"><span>Ask before paid requests</span><span id="guard-state" class="state">On</span></button></li>
    <li class="spend"><span id="spend">Estimated AI spend: ₹0.00 (0 requests)</span><button id="spend-reset" type="button" class="link">Reset</button></li>
    <li class="nav"><button id="shelf" type="button">My Shelf</button></li>
    <li class="nav"><button id="lab" type="button">Judges' Lab</button></li>
  </ul>
  </main>
  <script src="popup.js"></script>
</body>
</html>
