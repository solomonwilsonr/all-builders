<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeShelf Logo Reveal</title>
<!-- A 6-second logo sting in the Awesomic "Synapse" style, dressed in the website's theme (web/site/theme.css):
     a white page, the shield arrives as eight shards in blue, mint and ink that fly in, spin and lock together as
     the site blue, the tick draws on, the shockwave opens the homepage's pixel-dither sky behind a white card (the
     site's "white UI on pixel sky" look), then the mark slides left and the ink wordmark comes out from behind it.
     Nothing sits on the bottom edge: video players lay their controls there.
     Same contract as the other reels for render.mjs: window.seek(t), window.ready, window.DURATION.
       node render.mjs --page logo-reveal.html            → out/safeshelf-logo-reveal.mp4
     Open in a browser to preview: loops, space pauses, ?t=2 starts at 2 s. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
/* tokens from web/site/theme.css */
:root { --blue: #0271e4; --blue-pale: #e8f2fd; --mint: #a2f1a9; --ink: #001123; --line: #e4e7eb; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #efefef; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; transform-origin: 0 0;
  font-family: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }

/* the homepage's pixel sky, opened full-bleed by the shockwave */
#sky { inset: 0; background: url(../web/site/assets/sky.png) center / cover; image-rendering: pixelated; }
/* the white card the lockup sits on: invisible on the white page until the sky opens around it */
#card { left: 50%; top: 50%; background: #fff; border-radius: 2px; }
#ring { left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%; border: 3px solid var(--blue); }
#sparks { left: 50%; top: 50%; }
/* square sparks, a nod to the dither pixels */
#sparks i { position: absolute; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; background: var(--blue); }
#sparks i:nth-child(3n + 1) { background: var(--mint); }
#sparks i:nth-child(3n + 2) { background: var(--ink); }

#lockup { left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 44px; }
#mark { width: 230px; height: 230px; flex: none; overflow: visible; }
#solid { fill: var(--blue); }
#flash { fill: #fff; }
#tick { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; }
/* the nav logo's type: Schibsted Grotesk 500, tight tracking, ink */
#word { overflow: hidden; padding: 10px 6px 26px; margin-bottom: -6px; font-weight: 500; font-size: 176px; letter-spacing: -.04em; line-height: 1; white-space: nowrap; }
#word span { display: inline-block; will-change: transform; }

#hud { position: fixed; right: 12px; bottom: 10px; font: 12px ui-monospace, monospace; color: #8b949e; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs" id="sky"></div>
  <div class="abs" id="card"></div>
  <div class="abs" id="ring"></div>
  <div class="abs" id="sparks"></div>
  <div class="abs" id="lockup">
    <svg id="mark" viewBox="0 0 32 32" aria-label="SafeShelf">
      <defs id="defs"></defs>
      <g id="shards"></g>
      <path id="solid" d="M4 8a6 6 0 0 1 6-6h12a6 6 0 0 1 6 6v8c0 7-5.5 12-12 14C9.5 28 4 23 4 16z" opacity="0"/>
      <path id="flash" d="M4 8a6 6 0 0 1 6-6h12a6 6 0 0 1 6 6v8c0 7-5.5 12-12 14C9.5 28 4 23 4 16z" opacity="0"/>
      <path id="tick" d="m10.5 16 4 4 7-8" stroke-dashoffset="20"/>
    </svg>
    <div id="word" aria-label="SafeShelf"></div>
  </div>
</div>
<div id="hud"></div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const DURATION = 6;
const SHIELD = "M4 8a6 6 0 0 1 6-6h12a6 6 0 0 1 6 6v8c0 7-5.5 12-12 14C9.5 28 4 23 4 16z";
const CX = 16, CY = 15.5, N = 8;

// easing
const clamp = (x) => Math.min(1, Math.max(0, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outExpo = (x) => (x === 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outBack = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const inOutQuart = (x) => (x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(",")})`;
const BLUE = rgb("#0271e4");
const TINTS = ["#a2f1a9", "#0271e4", "#001123", "#5ff0ef", "#a2f1a9", "#0271e4", "#001123", "#b9c2ff"].map(rgb);

// eight pie-slice shards of the shield, each clipped from a full copy of it
const svgNS = "http://www.w3.org/2000/svg";
const shards = [];
for (let i = 0; i < N; i++) {
  const a0 = (i / N) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / N) * Math.PI * 2 - Math.PI / 2, R = 40;
  const pt = (a) => `${CX + R * Math.cos(a)},${CY + R * Math.sin(a)}`;
  const clip = document.createElementNS(svgNS, "clipPath");
  clip.id = `c${i}`;
  clip.innerHTML = `<polygon points="${CX},${CY} ${pt(a0)} ${pt((a0 + a1) / 2)} ${pt(a1)}"/>`;
  $("defs").appendChild(clip);
  const g = document.createElementNS(svgNS, "g");
  g.innerHTML = `<g clip-path="url(#c${i})"><path d="${SHIELD}"/></g>`;
  $("shards").appendChild(g);
  const mid = (a0 + a1) / 2;
  // alternate long and short throws and spin directions so it reads as a burst, not a flower
  shards.push({ g, path: g.querySelector("path"), tint: TINTS[i], ux: Math.cos(mid), uy: Math.sin(mid), dist: i % 2 ? 46 : 62,
    spin: (i % 2 ? -1 : 1) * (140 + 25 * (i % 3)), delay: [0, 3, 6, 1, 4, 7, 2, 5][i] * 0.055 });
}

// wordmark letters
const letters = [..."SafeShelf"].map((ch) => {
  const s = document.createElement("span");
  s.textContent = ch;
  $("word").appendChild(s);
  return s;
});

// twelve sparks thrown out when the shards lock
for (let i = 0; i < 12; i++) $("sparks").appendChild(document.createElement("i"));
const sparks = [...$("sparks").children];

// how far the mark sits from the stage centre once the wordmark is beside it: half of (gap + word);
// the svg has no offsetLeft to measure it from directly
let markShift = 0;
const measure = () => {
  const w = $("word").offsetWidth;
  markShift = (44 + w) / 2;
  const card = $("card").style;
  card.width = `${230 + 44 + w + 2 * 130}px`;
  card.height = `${230 + 2 * 120}px`;
  card.transform = "translate(-50%, -50%)";
};
// the mark starts dead centre and ends where the flex layout puts it beside the wordmark
const markShiftNow = (t) => markShift * (1 - inOutQuart(prog(t, 2.35, 3.15)));

function render(t) {
  // 1 · shards fly in from a burst, each in its own brand colour, and lock as the site blue (0.2 – 1.5 s)
  for (const s of shards) {
    const k = prog(t, 0.2 + s.delay, 1.25 + s.delay);
    const e = outExpo(k);
    const d = s.dist * (1 - e);
    const r = s.spin * (1 - e);
    const sc = lerp(0.35, 1, outBack(k, 1.2));
    s.g.setAttribute("transform", `translate(${s.ux * d} ${s.uy * d}) rotate(${r} ${CX} ${CY}) translate(${CX} ${CY}) scale(${sc}) translate(${-CX} ${-CY})`);
    s.g.setAttribute("opacity", clamp(k * 4));
    s.path.setAttribute("fill", mix(s.tint, BLUE, outCubic(prog(k, 0.55, 1))));
  }

  // 2 · the lock: punch, flash, ring, sparks (1.5 – 2.2 s)
  const lockT = 1.52;
  const p = prog(t, lockT, lockT + 0.45);
  const punch = 1 + 0.09 * Math.sin(Math.PI * p) * (1 - p * 0.4);
  // once locked, a whole shield covers the shards so no hairline seams show between them
  $("solid").setAttribute("opacity", t < lockT ? 0 : 1);
  $("flash").setAttribute("opacity", t < lockT ? 0 : 0.85 * (1 - outCubic(prog(t, lockT, lockT + 0.35))));
  const ring = prog(t, lockT, lockT + 0.9);
  const size = 230 + outExpo(ring) * 760;
  const off = `translateX(${markShiftNow(t) - markShift}px)`;
  $("ring").style.width = $("ring").style.height = `${size}px`;
  $("ring").style.transform = `${off} translate(-50%, -50%)`;
  $("ring").style.opacity = t < lockT ? 0 : 0.8 * (1 - ring);
  $("ring").style.borderWidth = `${lerp(6, 1, ring)}px`;
  const sp = prog(t, lockT, lockT + 0.7);
  sparks.forEach((el, i) => {
    const a = (i / sparks.length) * 360 + 15;
    const r = 150 + outExpo(sp) * (190 + (i % 3) * 40);
    el.style.transform = `${off} rotate(${a}deg) translateX(${r}px) rotate(${-a + sp * 90}deg) scale(${1 - sp})`;
    el.style.opacity = t < lockT ? 0 : 1;
  });

  // 3 · the tick draws on (1.62 – 2.05 s)
  $("tick").setAttribute("stroke-dashoffset", 20 * (1 - outCubic(prog(t, 1.62, 2.05))));

  // 4 · the sky opens from the lock just behind the ring, uncovering the card's edges (1.55 – 2.6 s);
  //     at the end it closes back to the white page so the loop is seamless
  const open = outExpo(prog(t, lockT + 0.03, lockT + 1.05)) * (1 - inOutQuart(prog(t, 5.35, 5.95)));
  $("sky").style.clipPath = `circle(${open * 1150}px at 50% 50%)`;
  $("card").style.boxShadow = `0 30px 80px rgba(0, 17, 35, ${0.18 * open})`;

  // 5 · mark slides left, wordmark comes out from behind it letter by letter (2.35 – 3.4 s)
  $("mark").style.transform = `translateX(${markShiftNow(t)}px) scale(${punch * lerp(1.18, 1, inOutQuart(prog(t, 2.35, 3.15)))})`;
  $("word").style.clipPath = `inset(0 0 0 ${Math.max(0, markShiftNow(t))}px)`;
  letters.forEach((el, i) => {
    const k = prog(t, 2.55 + i * 0.045, 3.25 + i * 0.045);
    const e = outExpo(k);
    el.style.transform = `translateY(${(1 - e) * 115}%) rotate(${(1 - e) * 8}deg)`;
    el.style.opacity = clamp(k * 3);
  });

  // 6 · hold, then fade back to the white page at the very end so it loops cleanly
  const out = outCubic(prog(t, 5.5, 6));
  $("lockup").style.opacity = 1 - out;
}

function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080), stage = $("stage");
  stage.style.transform = `scale(${k})`;
  stage.style.left = `${(innerWidth - 1920 * k) / 2}px`;
  stage.style.top = `${(innerHeight - 1080 * k) / 2}px`;
}
addEventListener("resize", fit); fit();

const sky = new Image();
sky.src = "../web/site/assets/sky.png";
window.DURATION = DURATION;
window.seek = (t) => render(t);
window.ready = Promise.all([document.fonts.ready, sky.decode().catch(() => {})]).then(() => { measure(); render(0); });

if (!params.has("render")) {
  const loop = params.get("loop") !== "0";
  let start = performance.now() - (parseFloat(params.get("t")) || 0) * 1000, paused = null;
  addEventListener("keydown", (e) => {
    if (e.code !== "Space") return;
    if (paused === null) paused = performance.now();
    else { start += performance.now() - paused; paused = null; }
  });
  window.ready.then(() => requestAnimationFrame(function tick(now) {
    let t = ((paused ?? now) - start) / 1000;
    if (t >= DURATION) { if (loop) { start = now; t = 0; } else t = DURATION; }
    render(t);
    $("hud").textContent = `${t.toFixed(2)} s · space to pause`;
    requestAnimationFrame(tick);
  }));
} else {
  $("hud").remove();
}
</script>
</body>
</html>
