openapi: 3.1.0
info:
  title: SafeShelf API
  version: 0.1.0
  description: |
    The single front door for every SafeShelf screen, agent and bot.
    Shared contract between Person A (Brain) and Person B (Face): change only after telling the other person.
    Each operation's `x-mock` names the example answer in `contracts/mock/` that the API returns when MOCK=1.
    Demo IDs are in `contracts/demo_products.json`.
servers:
  - url: http://localhost:8080
    description: Local (make api)
security:
  - apiKey: []

paths:
  /v1/products/identify:
    post:
      summary: Resolve a listing, image or identifiers to a product
      operationId: identifyProduct
      x-mock: identify.json
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListingInput'}
      responses:
        '200': {description: Product identity, content: {application/json: {schema: {$ref: '#/components/schemas/Identity'}}}}

  /v1/products/duplicates:
    post:
      summary: Find verified and possible duplicates (twins)
      operationId: findDuplicates
      x-mock: duplicates.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: {type: string, example: SS-P-10291}
      responses:
        '200': {description: Twins by relationship class, content: {application/json: {schema: {$ref: '#/components/schemas/Duplicates'}}}}

  /v1/products/{product_id}:
    get:
      summary: Get the product's identity
      operationId: getProduct
      x-mock: product.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Product, content: {application/json: {schema: {type: object, required: [product_id, brand, model]}}}}

  /v1/products/{product_id}/safety:
    get:
      summary: Evidence-backed safety findings (verdict colour is set by code, not the LLM)
      operationId: getSafety
      x-mock: safety.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Safety, content: {application/json: {schema: {$ref: '#/components/schemas/Safety'}}}}

  /v1/products/{product_id}/relationships:
    get:
      summary: Variants and related products
      operationId: getRelationships
      x-mock: relationships.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Relationships, content: {application/json: {schema: {type: object, required: [product_id, relationships]}}}}

  /v1/products/{product_id}/history:
    get:
      summary: Product history (Safety Passport); nothing is ever deleted
      operationId: getHistory
      x-mock: history.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: History, content: {application/json: {schema: {type: object, required: [product_id, events]}}}}

  /v1/products/{product_id}/certifications:
    get:
      summary: Safety-mark checks against official registries
      operationId: getCertifications
      x-mock: certifications.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Certification checks, content: {application/json: {schema: {$ref: '#/components/schemas/Certifications'}}}}

  /v1/products/{product_id}/alternatives:
    get:
      summary: Safer genuine twins (exact model or verified rebrand, no hazard reports)
      operationId: getAlternatives
      x-mock: alternatives.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Alternatives, content: {application/json: {schema: {type: object, required: [product_id, alternatives]}}}}

  /v1/products/{product_id}/case-file:
    get:
      summary: Exportable case file - findings with their evidence and quotes, the code rule behind the verdict, awaiting human review (never sent)
      operationId: getCaseFile
      x-mock: case_file.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Case file (JSON plus a printable markdown copy), content: {application/json: {schema: {type: object, required: [case_file_id, product_id, verdict, decided_by, findings, review_gate, markdown]}}}}

  /v1/products/{product_id}/owner-guidance:
    get:
      summary: Already bought it? What to do now - stop or take care, recall remedy, return, report, safer options
      operationId: getOwnerGuidance
      x-mock: owner_guidance.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Steps for an owner, content: {application/json: {schema: {type: object, required: [product_id, verdict, situation, headline, steps]}}}}

  /v1/listings/trust-check:
    post:
      summary: '"Is it real?": copied photos, impossible price, website age, impossible specs'
      operationId: trustCheck
      x-mock: trust_check.json
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListingInput'}
      responses:
        '200': {description: Trust check, content: {application/json: {schema: {$ref: '#/components/schemas/TrustCheck'}}}}

  /v1/listings/safety-check:
    post:
      summary: '"Is it safe?" for a listing with no SafeShelf product: recalls by brand and model, Safety Radar on the page reviews'
      operationId: listingSafetyCheck
      x-mock: listing_safety.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ListingInput'}
                - type: object
                  properties:
                    reviews:
                      type: array
                      description: The reviews shown on the page (no reviewer names)
                      items:
                        type: object
                        required: [text]
                        properties:
                          title: {type: string}
                          text: {type: string}
                          rating: {type: number}
                          date: {type: string, format: date}
      responses:
        '200': {description: Safety from the listing alone, content: {application/json: {schema: {$ref: '#/components/schemas/ListingSafety'}}}}

  /v1/reports:
    post:
      summary: Submit a consumer or analyst report (personal details are masked)
      operationId: createReport
      x-mock: report_created.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, description]
              properties:
                product_id: {type: string}
                description: {type: string}
                photo_urls: {type: array, items: {type: string}}
      responses:
        '201': {description: Report received, content: {application/json: {schema: {type: object, required: [report_id, status]}}}}

  /v1/shelf/items:
    post:
      summary: Add a product to My Shelf for recall alerts
      operationId: addShelfItem
      x-mock: shelf_item.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: {type: string}
                user_id: {type: string}
      responses:
        '201': {description: Saved, content: {application/json: {schema: {type: object, required: [item_id, product_id]}}}}

  /v1/catalog/scan:
    post:
      summary: Marketplace Catalog Scan (async batch job)
      operationId: catalogScan
      x-mock: catalog_scan.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv_url: {type: string, description: Cloud Storage URL of the uploaded catalog CSV}
                webhook_url: {type: string}
      responses:
        '202': {description: Job accepted (mock returns the finished job), content: {application/json: {schema: {type: object, required: [job_id, status]}}}}

  /v1/agent/sessions:
    post:
      summary: Start an agent session (Shelf Chat, Investigate, Safer Alternative, report draft, Shopper Agent step, Research Agent)
      description: >-
        One endpoint, one mode per ADK agent (engine/agents). Every step is returned in `steps` and written to the
        investigation trace under `investigation_id`. Colours are set by code, never by a model or by page text.
      operationId: startAgentSession
      x-mock: agent_session.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [chat, investigate, alternatives, report_draft, shopper_step, research, discover, recheck]}
                product_id: {type: string, description: 'SS-P-… or "unmatched"; needed for chat, alternatives, report_draft'}
                message: {type: string, description: 'chat only; may be empty when image is given. A pasted link is checked; if the shop blocks the server, by the product name shared with the link or in the link itself'}
                image: {type: string, description: 'chat: a screenshot of a product page, or a photo of a product or its label, as a data URL (data:image/png|jpeg|webp|heic;base64,…, at most 6 MB). Gemini reads it and the listing it shows is investigated; the answer''s link.page_read is "screenshot"'}
                language: {type: string, enum: [en, hi, bn, mr, te, ta, gu, ur, kn, or, ml, pa, ne, si, ja, ko, zh-Hans, zh-Hant, id, ms, th, vi, fil, my, km, lo], default: en}
                session_id: {type: string}
                context: {type: object, description: 'chat: the check result the shopper saw'}
                history: {type: array, items: {type: object}, description: 'chat: earlier turns {role, text}'}
                listing: {type: object, description: 'investigate: url, title, price, currency, seller, page_text, image_urls, reviews'}
                page_evidence: {type: object, description: 'investigate: {observations: [{kind, text, rating}]} read by the Shopper Agent'}
                deep: {type: boolean, description: 'investigate: also run the Research Agent on official recall sites'}
                step: {type: integer, description: shopper_step}
                elements: {type: array, items: {type: object}, description: 'shopper_step: numbered page elements {i, tag, kind, text, aria, href, already_read}'}
                observations: {type: array, items: {type: object}, description: shopper_step}
                brand: {type: string, description: research}
                model: {type: string, description: research}
                computer_use: {type: boolean, description: 'research: Gemini computer use drives the browser (slower)'}
      responses:
        '200': {description: Session, content: {application/json: {schema: {type: object, required: [session_id, messages]}}}}

  /v1/investigations/{investigation_id}/trace:
    get:
      summary: Every step of an investigation (model, tool, time, cost)
      operationId: getTrace
      x-mock: trace.json
      parameters:
        - {name: investigation_id, in: path, required: true, schema: {type: string, example: SS-I-0001}}
      responses:
        '200': {description: Trace, content: {application/json: {schema: {type: object, required: [investigation_id, steps]}}}}

  /v1/evidence:
    get:
      summary: Look up evidence records by ID (the source, quote and date behind an evidence ID)
      operationId: getEvidence
      x-mock: evidence.json
      parameters:
        - {name: ids, in: query, required: true, schema: {type: string, example: 'EV-201,EV-207'}, description: Comma-separated evidence IDs}
      responses:
        '200': {description: Evidence records, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Evidence'}}}}}

  /v1/recalls:
    get:
      summary: Recall Catalog - browse and search every official recall loaded (CPSC, ACCC, CAA, KATS...), newest first
      description: >-
        Official notices only; Safety Radar findings are not recalls and are not listed. Database only (no AI), so it
        does not count against the AI-check rate limit. Words in q must all appear (title, hazard, products,
        companies). hazard_type is a keyword match on the hazard text.
      operationId: listRecalls
      x-mock: recalls.json
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100, example: baby}}
        - {name: authority, in: query, schema: {type: string, example: 'ACCC,CAA'}, description: Comma-separated regulators, as in `sources`}
        - {name: country, in: query, schema: {type: string, example: Australia}, description: As in `sources`}
        - {name: hazard_type, in: query, schema: {$ref: '#/components/schemas/HazardType'}}
        - {name: from, in: query, schema: {type: string, format: date}, description: Notices on or after this date}
        - {name: to, in: query, schema: {type: string, format: date}, description: Notices on or before this date}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 24}}
      responses:
        '200':
          description: One page of recalls, plus every source with its count and latest notice (for filters and freshness)
          content:
            application/json:
              schema:
                type: object
                required: [total, page, per_page, recalls, sources, hazard_types]
                properties:
                  total: {type: integer, description: Recalls matching the filters, across all pages}
                  page: {type: integer}
                  per_page: {type: integer}
                  recalls: {type: array, items: {$ref: '#/components/schemas/Recall'}}
                  sources:
                    type: array
                    items:
                      type: object
                      required: [authority, recalls]
                      properties:
                        authority: {type: string}
                        country: {type: [string, 'null']}
                        recalls: {type: integer}
                        latest: {type: [string, 'null'], format: date}
                  hazard_types: {type: array, items: {$ref: '#/components/schemas/HazardType'}}

  /v1/recalls/{recall_id}:
    get:
      summary: One recall, with the SafeShelf products it covers (exact model matches only)
      operationId: getRecall
      x-mock: recall.json
      parameters:
        - {name: recall_id, in: path, required: true, schema: {type: string, example: 'oecd:AU:PS1067201'}}
      responses:
        '200':
          description: Recall
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Recall'}
                  - type: object
                    required: [safeshelf_products]
                    properties:
                      safeshelf_products:
                        type: array
                        description: Never a match still under human review
                        items: {type: object, required: [product_id], properties: {product_id: {type: string}, brand: {type: string}, model: {type: string}}}

  /v1/bench/results:
    get:
      summary: Latest SafeShelfBench results, with baselines
      operationId: getBenchResults
      x-mock: bench_results.json
      responses:
        '200': {description: Bench results, content: {application/json: {schema: {type: object, required: [tasks]}}}}

  # ---- plan v2.2: live investigations, sources, watchlists, review, enterprise -------------------------------------

  /v1/investigations:
    post:
      summary: Investigate any product (seen before or not) against live official sources; deep = durable job
      description: |
        Market from the shop URL, currency or `market`. Identity is read-only. Official sources for that market and
        global upstream sources are queried in parallel; every record is checked for source authenticity, claim
        support, exact model / variant / batch scope and country; copies count once; the outcome is set by code:
        confirmed_recall | substantiated_hazard_signal | potential_concern | no_matching_notice_found |
        insufficient_evidence. `coverage` says country by country what was checked, how and when.
        With `depth: deep` the answer is a job ({status: queued}); poll GET /v1/investigations/{id}.
        Send `Idempotency-Key` to make a retry safe.
      operationId: createInvestigation
      x-mock: investigation.json
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvestigationInput'}
      responses:
        '200': {description: Investigation (or a queued job), content: {application/json: {schema: {$ref: '#/components/schemas/Investigation'}}}}

  /v1/investigations/{investigation_id}:
    get:
      summary: An investigation's answer, or its job status while it runs
      operationId: getInvestigation
      x-mock: investigation.json
      parameters:
        - {name: investigation_id, in: path, required: true, schema: {type: string, example: INV-1A2B3C4D}}
      responses:
        '200': {description: Investigation, content: {application/json: {schema: {$ref: '#/components/schemas/Investigation'}}}}

  /v1/investigations/{investigation_id}/sources:
    get:
      summary: The sources an investigation checked, the records it matched and its claim passport
      operationId: getInvestigationSources
      x-mock: investigation_sources.json
      parameters:
        - {name: investigation_id, in: path, required: true, schema: {type: string, example: INV-1A2B3C4D}}
      responses:
        '200': {description: Sources, coverage and claims, content: {application/json: {schema: {type: object, required: [investigation_id]}}}}

  /v1/sources/health:
    get:
      summary: Public, redacted status of every official source (enabled, why not, last outcome, circuit)
      operationId: getSourcesHealth
      x-mock: sources_health.json
      responses:
        '200': {description: Source health, content: {application/json: {schema: {type: object, required: [sources]}}}}

  /v1/products/{product_id}/recheck:
    post:
      summary: Re-investigate a stored product now against live sources (new snapshot)
      operationId: recheckProduct
      x-mock: investigation.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Investigation, content: {application/json: {schema: {$ref: '#/components/schemas/Investigation'}}}}

  /v1/products/{product_id}/timeline:
    get:
      summary: The product's evidence timeline (identity versions, notices, hazard signals, checks, assessments)
      operationId: getTimeline
      x-mock: timeline.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Timeline, content: {application/json: {schema: {type: object, required: [product_id, events]}}}}

  /v1/products/{product_id}/supply-chain:
    get:
      summary: Manufacturer, importer, distributor and retailer edges, each cited to an official record
      operationId: getSupplyChain
      x-mock: supply_chain.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Supply-chain edges, content: {application/json: {schema: {type: object, required: [product_id, edges]}}}}

  /v1/products/{product_id}/cross-border:
    get:
      summary: Foreign notices naming this product's exact model (signals for its own market, never a local recall)
      operationId: getCrossBorder
      x-mock: cross_border.json
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Cross-border matches, content: {application/json: {schema: {type: object, required: [product_id, matches]}}}}

  /v1/camera/label:
    post:
      summary: Read a label photo (brand, model, batch, marks, visible damage) for the shopper to confirm
      description: The photo is not stored (only its hash). Names, addresses and phone numbers are removed.
      operationId: readLabel
      x-mock: camera_label.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, description: 'data:image/...;base64,...'}
      responses:
        '200': {description: What the label shows, to confirm, content: {application/json: {schema: {type: object, required: [read, needs_confirmation]}}}}

  /v1/watchlists:
    post:
      summary: Save a product to the shopper's watchlist (rechecked; alerts only for this model and batch)
      operationId: createWatchlist
      x-mock: watchlist.json
      parameters:
        - {name: X-Owner-Ref, in: header, required: true, schema: {type: string}, description: The screen's user id; stored only as a hash}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id: {type: string}
                brand: {type: string}
                model: {type: string}
                batch: {type: string}
                market: {type: string, example: IN}
                notify: {type: boolean, default: true}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, required: [watchlist_id]}}}}
    get:
      summary: The shopper's saved products and their latest outcome
      operationId: listWatchlists
      x-mock: watchlists.json
      parameters:
        - {name: X-Owner-Ref, in: header, required: true, schema: {type: string}}
      responses:
        '200': {description: Saved products, content: {application/json: {schema: {type: object, required: [items]}}}}

  /v1/watchlists/{watchlist_id}:
    delete:
      summary: Remove a saved product (its details are deleted, not just hidden)
      operationId: deleteWatchlist
      x-mock: watchlist_deleted.json
      parameters:
        - {name: watchlist_id, in: path, required: true, schema: {type: string}}
        - {name: X-Owner-Ref, in: header, required: true, schema: {type: string}}
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {type: object, required: [deleted]}}}}

  /v1/watchlists/recheck:
    post:
      summary: Re-investigate saved products and raise deduplicated alerts (scheduler; internal key)
      operationId: recheckWatchlists
      x-mock: watchlist_recheck.json
      responses:
        '200': {description: Recheck summary, content: {application/json: {schema: {type: object, required: [checked, alerts]}}}}

  /v1/identity/feedback:
    post:
      summary: A reviewer labels a product pair (joins the identity gold set; decisive labels write adjudicated edges)
      operationId: identityFeedback
      x-mock: identity_feedback.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, target_id, label, rationale]
              properties:
                source_id: {type: string}
                target_id: {type: string}
                label: {type: string, enum: [exact, rebrand, regional_variant, lookalike, counterfeit_suspect, distinct, unresolvable]}
                rationale: {type: string}
                market: {type: string}
      responses:
        '200': {description: Label stored, content: {application/json: {schema: {type: object, required: [pair_id, label]}}}}

  /v1/reports/{report_id}/review:
    post:
      summary: A reviewer substantiates, rejects or marks inconclusive a shopper's report (reviewer key)
      operationId: reviewReport
      x-mock: report_review.json
      parameters:
        - {name: report_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionInput'}
      responses:
        '200': {description: Report status, content: {application/json: {schema: {type: object, required: [report_id, status]}}}}

  /v1/reviews/queue:
    get:
      summary: Consequential ambiguous findings waiting for a person (reviewer key, tenant-scoped)
      operationId: getReviewQueue
      x-mock: review_queue.json
      parameters:
        - {name: state, in: query, required: false, schema: {type: string, enum: [open, second_review, decided]}}
      responses:
        '200': {description: Queue, content: {application/json: {schema: {type: object, required: [items]}}}}

  /v1/reviews/{case_id}/decisions:
    post:
      summary: Approve, correct, reject or escalate a case's queued items (cross-border needs two reviewers)
      operationId: decideReview
      x-mock: review_decision.json
      parameters:
        - {name: case_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionInput'}
      responses:
        '200': {description: Decisions, content: {application/json: {schema: {type: object, required: [case_id, decided]}}}}

  /v1/cases/{case_id}:
    get:
      summary: A safety case's lifecycle, history and pending actions
      operationId: getCase
      x-mock: case.json
      parameters:
        - {name: case_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Case, content: {application/json: {schema: {type: object, required: [case_id, lifecycle]}}}}

  /v1/cases/{case_id}/transition:
    post:
      summary: Move a case through its lifecycle (reviewer key; every move audited and reversible)
      operationId: transitionCase
      x-mock: case.json
      parameters:
        - {name: case_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, rationale]
              properties:
                to: {type: string, enum: [candidate, triage, investigating, substantiated, unsubstantiated, inconclusive, action_pending, resolved, reopened]}
                rationale: {type: string}
                action: {type: string, enum: [prefill_regulator_form, notify_owners, publish_correction]}
      responses:
        '200': {description: Case, content: {application/json: {schema: {type: object, required: [case_id]}}}}

  /v1/radar/candidates:
    get:
      summary: Products whose hazard signals clear their category baseline (investigation candidates, not defects)
      operationId: getRadarCandidates
      x-mock: radar_candidates.json
      responses:
        '200': {description: Candidates, content: {application/json: {schema: {type: object, required: [candidates]}}}}

  /v1/cross-border/candidates:
    get:
      summary: Notices in two countries naming the same model (earliest notice, lead time; for a person to check)
      operationId: getCrossBorderCandidates
      x-mock: cross_border_candidates.json
      responses:
        '200': {description: Candidates, content: {application/json: {schema: {type: object, required: [candidates]}}}}

  /v1/developer/usage:
    get:
      summary: This tenant's API usage (developer key)
      operationId: getDeveloperUsage
      x-mock: developer_usage.json
      responses:
        '200': {description: Usage, content: {application/json: {schema: {type: object, required: [tenant_id, operations]}}}}

  /v1/webhooks:
    post:
      summary: Register a signed webhook (https, public host; HMAC-SHA256 signature; secret shown once)
      operationId: createWebhook
      x-mock: webhook.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: {type: string, example: 'https://partner.example/safeshelf'}
                events: {type: array, items: {type: string, enum: [investigation.complete, watchlist.alert, review.decided, case.updated]}}
      responses:
        '200': {description: Webhook, content: {application/json: {schema: {type: object, required: [webhook_id]}}}}

  /v1/bench/runs:
    get:
      summary: Every versioned benchmark run (identity, historical, cross-border, evidence, prospective)
      operationId: getBenchRuns
      x-mock: bench_runs.json
      responses:
        '200': {description: Runs, content: {application/json: {schema: {type: object, required: [runs]}}}}

  /v1/bench/evidence:
    get:
      summary: Evidence-quality metrics from the verification benchmark (with sample sizes and intervals)
      operationId: getBenchEvidence
      x-mock: bench_evidence.json
      responses:
        '200': {description: Evidence metrics, content: {application/json: {schema: {type: object, required: [metrics]}}}}


components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key}

  parameters:
    ProductId:
      name: product_id
      in: path
      required: true
      schema: {type: string, example: SS-P-10291}

  schemas:
    Evidence:
      type: object
      required: [evidence_id, type, source, quote]
      properties:
        evidence_id: {type: string, example: EV-201}
        type: {type: string, enum: [review, review_photo, registry, listing_text, recall_notice, check, ai_label]}
        source: {type: string, description: 'Where it came from, in plain words, e.g. "Customer review on Amazon.in"'}
        date: {type: string, format: date}
        rating: {type: integer}
        quote: {type: string, description: The exact text the finding is based on; the extension uses it to find and highlight the text on the page}
        url: {type: string, nullable: true, description: Link to the original, when there is one}

    HazardType:
      type: string
      enum: [fire_burn, electric_shock, choking, chemical, mechanical_injury, other]

    Recall:
      type: object
      required: [recall_id, authority, notice_date, title, hazard, hazard_types, products, companies, images, url]
      properties:
        recall_id: {type: string, example: 'cpsc:23240'}
        authority: {type: string, example: ACCC}
        country: {type: [string, 'null']}
        notice_date: {type: [string, 'null'], format: date}
        title: {type: string}
        hazard: {type: string, description: The regulator's own words}
        hazard_types: {type: array, items: {$ref: '#/components/schemas/HazardType'}}
        products:
          type: array
          items: {type: object, properties: {name: {type: string}, model: {type: string}, description: {type: string}, units: {type: string}}}
        companies: {type: array, items: {type: string}, description: Manufacturers, importers and distributors named}
        images: {type: array, items: {type: object, required: [url], properties: {url: {type: string}, caption: {type: string}}}}
        action: {type: string, description: What the regulator tells owners to do}
        url: {type: [string, 'null'], description: The notice on the regulator's site}
        source: {type: string, description: e.g. "OECD GlobalRecalls" when it came through the OECD portal}

    ListingInput:
      type: object
      description: Give a URL, or page data the extension already read. At least one field is needed.
      properties:
        url: {type: string}
        title: {type: string}
        price: {type: number}
        currency: {type: string, default: INR}
        seller: {type: string}
        image_urls: {type: array, items: {type: string}}
        page_text: {type: string, description: Treated as data, never as instructions}

    RelationshipClass:
      type: string
      enum: [exact_model, rebranded_equivalent, model_variant, visually_similar, shared_component, regional_variant,
             unverified_rebrand, distinct_product]
      description: Only exact_model inherits a recall; rebranded_equivalent only after human verification;
        distinct_product is a reviewed negative edge (never the same product).

    Identity:
      type: object
      required: [product_id, brand, model, identity_status]
      properties:
        product_id: {type: string}
        listing_id: {type: string}
        category: {type: string}
        brand: {type: string}
        model: {type: string}
        attributes: {type: object}
        certifications_claimed: {type: array, items: {type: string}}
        identity_status: {type: string, enum: [provisional, verified, unknown]}
        confidence: {type: number}
        evidence_ids: {type: array, items: {type: string}}

    Duplicates:
      type: object
      required: [query_product_id, matches]
      properties:
        query_product_id: {type: string}
        graph_version: {type: integer}
        matches:
          type: array
          items:
            type: object
            required: [product_id, relationship, status]
            properties:
              product_id: {type: string}
              relationship: {$ref: '#/components/schemas/RelationshipClass'}
              status: {type: string, enum: [verified, unverified, rejected]}
              confidence: {type: number}
              agreements: {type: array, items: {type: string}}
              conflicts: {type: array, items: {type: string}}
              would_change_if: {type: array, items: {type: string}}
              evidence_ids: {type: array, items: {type: string}}

    Safety:
      type: object
      required: [product_id, verdict, official_status, ai_findings, label]
      properties:
        product_id: {type: string}
        verdict:
          type: string
          enum: [green, amber, red, not_enough_evidence]
          description: green = checked facts only, amber = AI findings under review, red = official recall
        official_status:
          type: object
          required: [recalled, checked]
          properties:
            recalled: {type: boolean}
            checked: {type: array, items: {type: string}}
            recall_ids: {type: array, items: {type: string}}
        ai_findings:
          type: array
          items:
            type: object
            required: [hazard_type, status, evidence_ids]
            properties:
              hazard_type: {type: string, enum: [fire_burn, electric_shock, choking, chemical, mechanical_injury, other]}
              mechanism: {type: string}
              severity: {type: string, enum: [low, medium, high]}
              independent_reports: {type: integer}
              with_photos: {type: integer}
              first_seen: {type: string, format: date}
              trend: {type: string, enum: [rising, stable, falling]}
              status: {type: string, enum: [under_review, confirmed, dismissed]}
              evidence_ids: {type: array, items: {type: string}}
              counterevidence: {type: string}
        certifications: {type: array, items: {$ref: '#/components/schemas/CertificationCheck'}}
        label: {type: string}
        outcome: {$ref: '#/components/schemas/Outcome'}
        headline: {type: string}
        safety_concern: {type: object, properties: {level: {type: string, enum: [high, medium, low, none, unknown]}, text: {type: string}}}
        evidence_strength: {type: string, enum: [strong, moderate, weak, none]}
        identity_confidence: {type: string, enum: [exact, variant, suspected_rebrand, family_named, lookalike, unresolved, none]}
        coverage: {$ref: '#/components/schemas/Coverage'}
        limitations: {type: array, items: {type: string}}
        as_of: {type: string, format: date-time}
        policy_version: {type: string}

    CertificationCheck:
      type: object
      required: [authority, result]
      properties:
        authority: {type: string}
        number: {type: string}
        claimed_value: {type: [string, 'null']}
        registry_value: {type: [string, 'null']}
        result: {type: string, enum: [verified, mismatch, unknown]}
        field: {type: [string, 'null'], description: Which field differs, for a mismatch}
        reason: {type: string}
        registry_record_url: {type: string}
        checked_at: {type: string, format: date-time}

    Certifications:
      type: object
      required: [product_id, checks]
      properties:
        product_id: {type: string}
        checks: {type: array, items: {$ref: '#/components/schemas/CertificationCheck'}}

    ListingSafety:
      type: object
      required: [verdict, official_status, ai_findings, reviews_checked, label]
      properties:
        listing_url: {type: [string, 'null']}
        brand: {type: [string, 'null']}
        model: {type: [string, 'null']}
        verdict: {type: string, enum: [red, amber, green, not_enough_evidence]}
        official_status:
          type: object
          description: Same as Safety.official_status, plus the matching notices (exact model first, then for review)
        ai_findings: {type: array, items: {type: object}}
        reviews_checked: {type: integer, description: Reviews from this page read so far (this visit and earlier ones)}
        label: {type: string}

    TrustCheck:
      type: object
      required: [checks, summary, label]
      properties:
        listing_url: {type: string}
        matched_product_id: {type: [string, 'null']}
        checks:
          type: object
          properties:
            copied_photos: {type: object, required: [result]}
            price: {type: object, required: [result]}
            website_age: {type: object, required: [result]}
            spec: {type: object, required: [result]}
            seller: {type: object, required: [result], description: 'Only when no genuine product is on file: the brand itself, an authorised seller (ok) or a third party (unknown)'}
        hidden_instructions_found: {type: boolean}
        good_signs: {type: array, items: {type: string}, description: 'Only when no genuine product is on file: plain-words reasons for the checks that passed'}
        summary: {type: string, description: 'Always "Be careful: ..." with reasons; never "scam"'}
        safety_of_genuine_model: {type: string}
        label: {type: string}

    Outcome:
      type: string
      enum: [confirmed_recall, substantiated_hazard_signal, potential_concern, no_matching_notice_found, insufficient_evidence]
      description: Set by code (engine/evidence_verification/adjudicator.py). A foreign recall is never confirmed_recall;
        no_matching_notice_found is not proof of safety.

    Coverage:
      type: object
      description: Country by country, what was checked (checked_live, checked_cache, no_matching_notice_found,
        source_unavailable, not_supported), when, and how fresh.
      properties:
        summary: {type: string}
        countries:
          type: array
          items:
            type: object
            required: [country, state]
            properties:
              country: {type: string, example: IN}
              name: {type: string}
              is_market: {type: boolean}
              state: {type: string, enum: [checked_live, checked_cache, no_matching_notice_found, source_unavailable, not_supported]}
              checked_at: {type: [string, 'null']}
              matched: {type: integer}
              sources: {type: array, items: {type: object}}
              notes: {type: array, items: {type: string}}
        sources: {type: array, items: {type: object}}

    InvestigationInput:
      type: object
      description: At least a url, title, brand, model, gtin or product_id.
      properties:
        url: {type: string}
        title: {type: string}
        brand: {type: string}
        model: {type: string}
        gtin: {type: string}
        batch: {type: string, description: serial, lot or date code}
        product_id: {type: string}
        market: {type: string, description: 'ISO 3166-1 alpha-2 (IN, JP, AU, SG...); else from the URL or currency'}
        currency: {type: string}
        depth: {type: string, enum: [quick, deep], default: quick}
        reviews: {type: array, items: {type: object}, description: the page's reviews, for an unknown product}
        as_of: {type: string, format: date, description: historical replay - nothing published later is used}

    Investigation:
      type: object
      required: [investigation_id, status]
      properties:
        investigation_id: {type: string}
        status: {type: string, enum: [queued, running, complete, failed]}
        job_status: {type: string}
        market: {type: [string, 'null']}
        product: {type: object}
        outcome: {$ref: '#/components/schemas/Outcome'}
        basis: {type: string}
        headline: {type: string}
        colour: {type: string, enum: [red, amber, green, unknown]}
        safety_concern: {type: object}
        evidence_strength: {type: string}
        identity_confidence: {type: string}
        coverage: {$ref: '#/components/schemas/Coverage'}
        matches: {type: array, items: {type: object}}
        claims: {type: array, items: {$ref: '#/components/schemas/EvidenceClaim'}}
        contradictions: {type: array, items: {type: object}}
        hazards: {type: array, items: {type: object}}
        what_would_change: {type: array, items: {type: object}}
        limitations: {type: array, items: {type: string}}
        review_required: {type: boolean}
        source_mode: {type: string, enum: [live, cache, partial, none, mock]}
        retrieved_at: {type: string}
        policy_version: {type: string}
        snapshot_id: {type: [string, 'null']}

    EvidenceClaim:
      type: object
      description: The claim-level evidence passport (engine/evidence_verification/claims.py).
      required: [claim_id, claim_type, claim_text, source_registry_id, source_record_id]
      properties:
        claim_id: {type: string}
        claim_type: {type: string}
        claim_text: {type: string}
        source_registry_id: {type: string}
        source_record_id: {type: string}
        source_url: {type: string}
        source_excerpt: {type: string}
        source_language: {type: string}
        event_at: {type: [string, 'null']}
        source_published_at: {type: [string, 'null']}
        source_updated_at: {type: [string, 'null']}
        retrieved_at: {type: [string, 'null']}
        source_authenticity_status: {type: string}
        claim_support_status: {type: string}
        product_match_tier: {type: string}
        identity_scope_status: {type: string}
        verification_status: {type: string}
        review_status: {type: string}

    ReviewDecisionInput:
      type: object
      required: [decision, rationale]
      properties:
        decision: {type: string, enum: [approve, correct, reject, escalate]}
        rationale: {type: string}
        correction: {type: object}
        queue_id: {type: string}
