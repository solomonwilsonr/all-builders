components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key}

  parameters:
    ProductId:
      name: product_id
      in: path
      required: true
      schema: {type: string, example: SS-P-10291}

  schemas:
    Evidence:
      type: object
      required: [evidence_id, type, source, quote]
      properties:
        evidence_id: {type: string, example: EV-201}
        type: {type: string, enum: [review, review_photo, registry, listing_text, recall_notice, check, ai_label]}
        source: {type: string, description: 'Where it came from, in plain words, e.g. "Customer review on Amazon.in"'}
        date: {type: string, format: date}
        rating: {type: integer}
        quote: {type: string, description: The exact text the finding is based on; the extension uses it to find and highlight the text on the page}
        url: {type: string, nullable: true, description: Link to the original, when there is one}

    HazardType:
      type: string
      enum: [fire_burn, electric_shock, choking, chemical, mechanical_injury, other]

    Recall:
      type: object
      required: [recall_id, authority, notice_date, title, hazard, hazard_types, products, companies, images, url]
      properties:
        recall_id: {type: string, example: 'cpsc:23240'}
        authority: {type: string, example: ACCC}
        country: {type: [string, 'null']}
        notice_date: {type: [string, 'null'], format: date}
        title: {type: string}
        hazard: {type: string, description: The regulator's own words}
        hazard_types: {type: array, items: {$ref: '#/components/schemas/HazardType'}}
        products:
          type: array
          items: {type: object, properties: {name: {type: string}, model: {type: string}, description: {type: string}, units: {type: string}}}
        companies: {type: array, items: {type: string}, description: Manufacturers, importers and distributors named}
        images: {type: array, items: {type: object, required: [url], properties: {url: {type: string}, caption: {type: string}}}}
        action: {type: string, description: What the regulator tells owners to do}
        url: {type: [string, 'null'], description: The notice on the regulator's site}
        source: {type: string, description: e.g. "OECD GlobalRecalls" when it came through the OECD portal}

    ListingInput:
      type: object
      description: Give a URL, or page data the extension already read. At least one field is needed.
      properties:
        url: {type: string}
        title: {type: string}
        price: {type: number}
        currency: {type: string, default: INR}
        seller: {type: string}
        image_urls: {type: array, items: {type: string}}
        page_text: {type: string, description: Treated as data, never as instructions}

    RelationshipClass:
      type: string
      enum: [exact_model, rebranded_equivalent, model_variant, visually_similar, shared_component, regional_variant,
             unverified_rebrand, distinct_product]
      description: Only exact_model inherits a recall; rebranded_equivalent only after human verification;
        distinct_product is a reviewed negative edge (never the same product).

    Identity:
      type: object
      required: [product_id, brand, model, identity_status]
      properties:
        product_id: {type: string}
        listing_id: {type: string}
        category: {type: string}
        brand: {type: string}
        model: {type: string}
        attributes: {type: object}
        certifications_claimed: {type: array, items: {type: string}}
        identity_status: {type: string, enum: [provisional, verified, unknown]}
        confidence: {type: number}
        evidence_ids: {type: array, items: {type: string}}

    Duplicates:
      type: object
      required: [query_product_id, matches]
      properties:
        query_product_id: {type: string}
        graph_version: {type: integer}
        matches:
          type: array
          items:
            type: object
            required: [product_id, relationship, status]
            properties:
              product_id: {type: string}
              relationship: {$ref: '#/components/schemas/RelationshipClass'}
              status: {type: string, enum: [verified, unverified, rejected]}
              confidence: {type: number}
              agreements: {type: array, items: {type: string}}
              conflicts: {type: array, items: {type: string}}
              would_change_if: {type: array, items: {type: string}}
              evidence_ids: {type: array, items: {type: string}}

    Safety:
      type: object
      required: [product_id, verdict, official_status, ai_findings, label]
      properties:
        product_id: {type: string}
        verdict:
          type: string
          enum: [green, amber, red, not_enough_evidence]
          description: green = checked facts only, amber = AI findings under review, red = official recall
        official_status:
          type: object
          required: [recalled, checked]
          properties:
            recalled: {type: boolean}
            checked: {type: array, items: {type: string}}
            recall_ids: {type: array, items: {type: string}}
        ai_findings:
          type: array
          items:
            type: object
            required: [hazard_type, status, evidence_ids]
            properties:
              hazard_type: {type: string, enum: [fire_burn, electric_shock, choking, chemical, mechanical_injury, other]}
              mechanism: {type: string}
              severity: {type: string, enum: [low, medium, high]}
              independent_reports: {type: integer}
              with_photos: {type: integer}
              first_seen: {type: string, format: date}
              trend: {type: string, enum: [rising, stable, falling]}
              status: {type: string, enum: [under_review, confirmed, dismissed]}
              evidence_ids: {type: array, items: {type: string}}
              counterevidence: {type: string}
        certifications: {type: array, items: {$ref: '#/components/schemas/CertificationCheck'}}
        label: {type: string}
        outcome: {$ref: '#/components/schemas/Outcome'}
        headline: {type: string}
        safety_concern: {type: object, properties: {level: {type: string, enum: [high, medium, low, none, unknown]}, text: {type: string}}}
        evidence_strength: {type: string, enum: [strong, moderate, weak, none]}
        identity_confidence: {type: string, enum: [exact, variant, suspected_rebrand, family_named, lookalike, unresolved, none]}
        coverage: {$ref: '#/components/schemas/Coverage'}
        limitations: {type: array, items: {type: string}}
        as_of: {type: string, format: date-time}
        policy_version: {type: string}

    CertificationCheck:
      type: object
      required: [authority, result]
      properties:
        authority: {type: string}
        number: {type: string}
        claimed_value: {type: [string, 'null']}
        registry_value: {type: [string, 'null']}
        result: {type: string, enum: [verified, mismatch, unknown]}
        field: {type: [string, 'null'], description: Which field differs, for a mismatch}
        reason: {type: string}
        registry_record_url: {type: string}
        checked_at: {type: string, format: date-time}

    Certifications:
      type: object
      required: [product_id, checks]
      properties:
        product_id: {type: string}
        checks: {type: array, items: {$ref: '#/components/schemas/CertificationCheck'}}

    ListingSafety:
      type: object
      required: [verdict, official_status, ai_findings, reviews_checked, label]
      properties:
        listing_url: {type: [string, 'null']}
        brand: {type: [string, 'null']}
        model: {type: [string, 'null']}
        verdict: {type: string, enum: [red, amber, green, not_enough_evidence]}
        official_status:
          type: object
          description: Same as Safety.official_status, plus the matching notices (exact model first, then for review)
        ai_findings: {type: array, items: {type: object}}
        reviews_checked: {type: integer, description: Reviews from this page read so far (this visit and earlier ones)}
        label: {type: string}

    ReviewTheme:
      type: object
      required: [aspect, phrase, mentions]
      properties:
        aspect: {type: string, enum: [build_quality, durability, performance, value, as_described, size_fit, ease_of_use, delivery_packaging, seller_service, other]}
        phrase: {type: string, description: 'The most common wording, e.g. "stopped working after 2 months"'}
        mentions: {type: integer, description: Reviews read that mention it}
        share_estimate: {type: [number, 'null'], description: 'Estimated share of all buyers (0-1), weighted by the star summary; null when too few reviews were read'}
        evidence_ids: {type: array, items: {type: string}}
        quote: {type: string, description: complaints only - a buyer's own words}
        reviews:
          type: array
          description: Complaints only - every review counted for it (lowest stars first), so a screen can show them without another call
          items:
            type: object
            properties:
              rating: {type: [number, 'null']}
              date: {type: [string, 'null']}
              title: {type: [string, 'null']}
              text: {type: string}

    ReviewVerdict:
      type: object
      required: [verdict, headline, confidence, rating, reviews_read, liked, complaints, trust, reasons, label]
      properties:
        listing_url: {type: [string, 'null']}
        verdict: {type: string, enum: [good, mixed, poor, not_enough_reviews], description: 'good = at least 75% 4-5 stars and no complaint from about 1 buyer in 10; mixed = a complaint from about 1 buyer in 10 or more (only when at least 15 unhappy reviews were read); poor = under 55% 4-5 stars or an average under 3.5 (the stars alone decide poor); fewer than 30 ratings = not_enough_reviews'}
        headline: {type: string}
        confidence: {type: string, enum: [high, medium, low]}
        rating:
          type: object
          properties:
            average: {type: [number, 'null']}
            count: {type: [integer, 'null']}
            positive_share: {type: [number, 'null'], description: share of 4-5 star ratings}
            source: {type: string, enum: [page_summary, reviews_read, none]}
        reviews_read: {type: integer}
        reviews_labelled: {type: integer}
        liked: {type: array, items: {$ref: '#/components/schemas/ReviewTheme'}}
        complaints: {type: array, items: {$ref: '#/components/schemas/ReviewTheme'}}
        trust:
          type: object
          properties:
            may_be_inflated: {type: boolean}
            flags: {type: array, items: {type: object, properties: {kind: {type: string, enum: [same_day_burst, repeated_text, few_verified]}, detail: {type: string}}}}
        reasons: {type: array, items: {type: string}, description: The code rules behind the verdict, in plain words}
        policy_version: {type: string}
        label: {type: string}

    PriceBenchmark:
      type: object
      required: [verdict, listing_price, currency, reasons, label]
      properties:
        verdict: {type: string, enum: [too_low, below_usual, normal, high, not_enough_data], description: 'too_low = under 40% of the lowest credible genuine price; below_usual = under 70% of the median; high = over 150% of the highest. Needs at least 3 reference prices, else not_enough_data'}
        headline: {type: string}
        listing_price: {type: [number, 'null']}
        currency: {type: string}
        mrp: {type: [number, 'null'], description: The list price (M.R.P.) the page shows}
        category: {type: [string, 'null'], description: 'What was compared, e.g. "60W USB-C chargers"'}
        specs: {type: object, description: 'Specs read from the listing, e.g. {power_watts: 60}', additionalProperties: {type: [number, string]}}
        genuine_range:
          type: [object, 'null']
          properties: {low: {type: number}, median: {type: number}, high: {type: number}}
        position: {type: [number, 'null'], description: 'This listing''s price as a share of the genuine median (0.17 = 17%)'}
        answer:
          type: object
          description: 'The shopper''s question answered in one sentence: is this product possible at this price? not_possible = under 40% of the cheapest genuine price (or too cheap for the technology claimed); unlikely = below every genuine one found; possible = otherwise; cant_tell = not enough reference prices'
          required: [verdict, text]
          properties:
            verdict: {type: string, enum: [not_possible, unlikely, possible, cant_tell]}
            subject: {type: [string, 'null'], description: 'e.g. "33W charger"'}
            text: {type: string}
        value:
          type: [object, 'null']
          description: 'Price against the technology: price per watt (or per 1,000mAh) compared with genuine products that have the same technology (GaN, PD/PPS). null when the size is unknown or fewer than 3 products can be compared'
          properties:
            verdict: {type: string, enum: [too_cheap_for_tech, cheap_for_tech, fair, pricey_for_tech], description: 'too_cheap_for_tech = under 40% of the lowest genuine price per unit: the technology cannot be sold that cheap (also makes the price verdict too_low)'}
            unit: {type: string}
            per_unit: {type: object, properties: {listing: {type: number}, low: {type: number}, median: {type: number}, high: {type: number}}}
            features: {type: array, items: {type: string, enum: [gan, pd, multiport]}}
            compared_with_same_technology: {type: boolean}
            text: {type: string}
        comparables:
          type: array
          description: The reference prices behind the range, cheapest first
          items:
            type: object
            required: [name, price]
            properties:
              name: {type: string}
              brand: {type: [string, 'null']}
              price: {type: number}
              kind: {type: string, enum: [same_model, comparable]}
              source: {type: [string, 'null']}
              source_url: {type: [string, 'null']}
              seen: {type: [string, 'null'], format: date}
        reasons: {type: array, items: {type: string}}
        basis: {type: string, enum: [curated_brands, similar_specs], description: 'curated_brands = compared with brands shoppers in the market buy, at the same size; similar_specs = a product with no curated category, compared with similar products found online'}
        policy_version: {type: string}
        label: {type: string}

    ClaimResult:
      type: object
      required: [claim, result, why, basis]
      properties:
        claim: {type: string, description: 'The claim as the listing makes it, e.g. "60W output"'}
        result: {type: string, enum: [possible, doubtful, not_possible, cant_tell]}
        why: {type: string}
        basis: {type: string, enum: [rule, cited_source, none], description: 'rule = a physical limit checked in code; cited_source = sources found online; none = could not be checked'}
        sources: {type: array, items: {type: object, properties: {title: {type: string}, url: {type: string}}}}

    ClaimsCheck:
      type: object
      required: [verdict, headline, claims, reasons, label]
      properties:
        verdict: {type: string, enum: [possible, doubtful, not_possible, cant_tell]}
        headline: {type: string}
        category: {type: [string, 'null']}
        claims: {type: array, items: {$ref: '#/components/schemas/ClaimResult'}}
        reasons: {type: array, items: {type: string}}
        policy_version: {type: string}
        label: {type: string}
        checked_on: {type: string, format: date}

    ListingAge:
      type: object
      required: [verdict, headline, tone, text, basis, reasons, label]
      properties:
        verdict: {type: string, enum: [new, recent, under_a_year, established, listed_at_least, no_reviews, unknown], description: 'new = under 30 days; recent = 30-90 days; under_a_year = 90-365 days; established = a year or more (from the page date, or from the first review when every review was read); listed_at_least = only a floor from the oldest review of some; no_reviews = no reviews were found when all were read; unknown = nothing to date it by'}
        headline: {type: string}
        tone: {type: string, enum: [ok, warn, none]}
        listed_on: {type: [string, 'null'], format: date}
        age_days: {type: [integer, 'null']}
        text: {type: string}
        brand:
          type: [object, 'null']
          description: "Amazon's brand card: how long the BRAND has sold on Amazon and how buyers rate it. Not the listing's or the seller's age; never part of the verdict"
          properties:
            name: {type: [string, 'null']}
            years_on_amazon: {type: [string, 'null'], description: 'As Amazon prints it, e.g. "10+"'}
            positive_ratings: {type: [object, 'null'], properties: {percent: {type: integer}, customers: {type: string}}}
            recent_orders: {type: [string, 'null'], description: 'e.g. "100K+"'}
        basis: {type: string, enum: [date_first_available, first_review, review_floor, no_reviews, none], description: 'where the age came from: the page date, the first review (all reviews read), the oldest review read (a floor), or no reviews at all'}
        reasons: {type: array, items: {type: string}}
        policy_version: {type: string}
        label: {type: string}

    OfficialSeller:
      type: object
      required: [verdict, headline, tone, text, reasons, label]
      properties:
        verdict: {type: string, enum: [official_brand, official_seller, amazon_retail, third_party, channel_not_listed, channel_listed, official_website, third_party_website, no_list, unknown_brand], description: 'no_list and unknown_brand mean the brand has published nothing usable: screens show nothing for them'}
        official: {type: [boolean, 'null'], description: 'true = the brand''s own page makes this seller or shop an official partner; false = it does not (it names others); null = not settled (a name hint, Amazon itself, or no list). Screens highlight this'}
        headline: {type: string}
        tone: {type: string, enum: [ok, none], description: 'ok = named by the brand; never a warning colour'}
        text: {type: string}
        brand: {type: [string, 'null']}
        mentioned_brand: {type: string, description: 'Set when the title does not open with a brand SafeShelf knows but names one ("compatible with CMF Phone 1"): the answer is about that brand on this shop'}
        seller: {type: [string, 'null']}
        marketplace: {type: [string, 'null'], description: The shop's registrable domain}
        official_channels: {type: [array, 'null'], items: {type: string}}
        source:
          type: [object, 'null']
          description: The brand's own page the statement comes from
          properties: {text: {type: [string, 'null']}, url: {type: [string, 'null']}, as_of: {type: [string, 'null']}, retrieved: {type: [string, 'null']}}
        reasons: {type: array, items: {type: string}}
        policy_version: {type: string}
        label: {type: string}

    TrustCheck:
      type: object
      required: [checks, summary, label]
      properties:
        listing_url: {type: string}
        matched_product_id: {type: [string, 'null']}
        checks:
          type: object
          properties:
            copied_photos: {type: object, required: [result]}
            price: {type: object, required: [result]}
            website_age: {type: object, required: [result]}
            spec: {type: object, required: [result]}
            seller: {type: object, required: [result], description: 'Only when no genuine product is on file: the brand itself, an authorised seller (ok) or a third party (unknown)'}
        hidden_instructions_found: {type: boolean}
        good_signs: {type: array, items: {type: string}, description: 'Only when no genuine product is on file: plain-words reasons for the checks that passed'}
        summary: {type: string, description: 'Always "Be careful: ..." with reasons; never "scam"'}
        safety_of_genuine_model: {type: string}
        label: {type: string}

    Outcome:
      type: string
      enum: [confirmed_recall, substantiated_hazard_signal, potential_concern, no_matching_notice_found, insufficient_evidence]
      description: Set by code (engine/evidence_verification/adjudicator.py). A foreign recall is never confirmed_recall;
        no_matching_notice_found is not proof of safety.

    Coverage:
      type: object
      description: Country by country, what was checked (checked_live, checked_cache, no_matching_notice_found,
        source_unavailable, not_supported), when, and how fresh.
      properties:
        summary: {type: string}
        countries:
          type: array
          items:
            type: object
            required: [country, state]
            properties:
              country: {type: string, example: IN}
              name: {type: string}
              is_market: {type: boolean}
              state: {type: string, enum: [checked_live, checked_cache, no_matching_notice_found, source_unavailable, not_supported]}
              checked_at: {type: [string, 'null']}
              matched: {type: integer}
              sources: {type: array, items: {type: object}}
              notes: {type: array, items: {type: string}}
        sources: {type: array, items: {type: object}}

    InvestigationInput:
      type: object
      description: At least a url, title, brand, model, gtin or product_id.
      properties:
        url: {type: string}
        title: {type: string}
        brand: {type: string}
        model: {type: string}
        gtin: {type: string}
        batch: {type: string, description: serial, lot or date code}
        product_id: {type: string}
        market: {type: string, description: 'ISO 3166-1 alpha-2 (IN, JP, AU, SG...); else from the URL or currency'}
        currency: {type: string}
        depth: {type: string, enum: [quick, deep], default: quick}
        reviews: {type: array, items: {type: object}, description: the page's reviews, for an unknown product}
        as_of: {type: string, format: date, description: historical replay - nothing published later is used}

    Investigation:
      type: object
      required: [investigation_id, status]
      properties:
        investigation_id: {type: string}
        status: {type: string, enum: [queued, running, complete, failed]}
        job_status: {type: string}
        market: {type: [string, 'null']}
        product: {type: object}
        outcome: {$ref: '#/components/schemas/Outcome'}
        basis: {type: string}
        headline: {type: string}
        colour: {type: string, enum: [red, amber, green, unknown]}
        safety_concern: {type: object}
        evidence_strength: {type: string}
        identity_confidence: {type: string}
        coverage: {$ref: '#/components/schemas/Coverage'}
        matches: {type: array, items: {type: object}}
        claims: {type: array, items: {$ref: '#/components/schemas/EvidenceClaim'}}
        contradictions: {type: array, items: {type: object}}
        hazards: {type: array, items: {type: object}}
        what_would_change: {type: array, items: {type: object}}
        limitations: {type: array, items: {type: string}}
        review_required: {type: boolean}
        source_mode: {type: string, enum: [live, cache, partial, none, mock]}
        retrieved_at: {type: string}
        policy_version: {type: string}
        snapshot_id: {type: [string, 'null']}

    EvidenceClaim:
      type: object
      description: The claim-level evidence passport (engine/evidence_verification/claims.py).
      required: [claim_id, claim_type, claim_text, source_registry_id, source_record_id]
      properties:
        claim_id: {type: string}
        claim_type: {type: string}
        claim_text: {type: string}
        source_registry_id: {type: string}
        source_record_id: {type: string}
        source_url: {type: string}
        source_excerpt: {type: string}
        source_language: {type: string}
        event_at: {type: [string, 'null']}
        source_published_at: {type: [string, 'null']}
        source_updated_at: {type: [string, 'null']}
        retrieved_at: {type: [string, 'null']}
        source_authenticity_status: {type: string}
        claim_support_status: {type: string}
        product_match_tier: {type: string}
        identity_scope_status: {type: string}
        verification_status: {type: string}
        review_status: {type: string}

    ReviewDecisionInput:
      type: object
      required: [decision, rationale]
      properties:
        decision: {type: string, enum: [approve, correct, reject, escalate]}
        rationale: {type: string}
        correction: {type: object}
        queue_id: {type: string}
