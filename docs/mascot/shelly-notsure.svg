<text x="120" y="187" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="24" fill="#001123">?</text>
<path d="M182 22 h40 a10 10 0 0 1 10 10 v24 a10 10 0 0 1-10 10 h-24 l-12 10 v-10 a10 10 0 0 1-10-10 v-24 a10 10 0 0 1 10-10z" fill="#fff" stroke="#001123" stroke-width="3.5" stroke-linejoin="round"/><text x="202" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#0271e4">?</text>
</svg>
