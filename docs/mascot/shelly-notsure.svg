<path d="M93 92 Q101 90 109 94M131 88 Q139 84 147 88" fill="none" stroke="#001123" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="88" cy="126" rx="7" ry="4.5" fill="#ff9fb8" opacity=".75"/><ellipse cx="152" cy="126" rx="7" ry="4.5" fill="#ff9fb8" opacity=".75"/>
<path d="M110 131 H130" fill="none" stroke="#001123" stroke-width="3.5" stroke-linecap="round"/>
<!-- chest badge: follows the verdict, so only a clear result ever shows a green tick -->
