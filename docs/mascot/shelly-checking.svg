<circle cx="118" cy="176" r="6.5" fill="none" stroke="#001123" stroke-width="3.5"/><path d="m123 181 5 5" stroke="#001123" stroke-width="4" stroke-linecap="round"/>
<path d="M206 108 L198 94" stroke="#001123" stroke-width="7" stroke-linecap="round"/><circle cx="190" cy="76" r="20" fill="#e8f2fd" fill-opacity=".75" stroke="#001123" stroke-width="5"/><path d="M179 69 a13 13 0 0 1 9-7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle cx="206" cy="112" r="11" fill="#ffffff" stroke="#001123" stroke-width="3.5"/>
