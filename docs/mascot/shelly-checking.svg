<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="Shelly, the SafeShelf mascot: checking a listing">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset=".55" stop-color="#1f84f0"/><stop offset="1" stop-color="#0262c8"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f1fd"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5aa9ff" stop-opacity=".55"/><stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  
</defs>
<ellipse cx="120" cy="246" rx="62" ry="8" fill="#001123" opacity=".12"/>
<!-- antenna: the verdict light -->
<path d="M120 46 C120 34 124 26 132 20" fill="none" stroke="#001123" stroke-width="4" stroke-linecap="round"/>
<circle cx="134" cy="17" r="20" fill="url(#glow)"/>
<circle cx="134" cy="17" r="9" fill="#5aa9ff" stroke="#001123" stroke-width="3"/>
<circle cx="131" cy="14" r="2.6" fill="#fff" opacity=".8"/>
<!-- feet -->
<ellipse cx="96" cy="236" rx="18" ry="10" fill="#001123"/>
<ellipse cx="144" cy="236" rx="18" ry="10" fill="#001123"/>
<!-- arms -->
<path d="M60 140 C44 150 40 170 46 184" fill="#1f84f0" stroke="#001123" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="188" r="11" fill="#ffffff" stroke="#001123" stroke-width="3.5"/>
<path d="M180 140 C196 136 204 126 206 116" fill="#1f84f0" stroke="#001123" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="206" cy="112" r="11" fill="#ffffff" stroke="#001123" stroke-width="3.5"/>
