[project]
name = "safeshelf-agents"
version = "0.1.0"
description = "SafeShelf agents (Google ADK): Shelf Chat now, Investigate and others later"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
