<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="Shelly, the SafeShelf mascot: all clear, green verdict">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset=".55" stop-color="#1f84f0"/><stop offset="1" stop-color="#0262c8"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f1fd"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4fd18b" stop-opacity=".55"/><stop offset="1" stop-color="#4fd18b" stop-opacity="0"/></radialGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  
</defs>
<ellipse cx="120" cy="246" rx="62" ry="8" fill="#001123" opacity=".12"/>
<!-- antenna: the verdict light -->
<path d="M120 46 C120 34 124 26 132 20" fill="none" stroke="#001123" stroke-width="4" stroke-linecap="round"/>
<circle cx="134" cy="17" r="20" fill="url(#glow)"/>
<circle cx="134" cy="17" r="9" fill="#4fd18b" stroke="#001123" stroke-width="3"/>
<circle cx="131" cy="14" r="2.6" fill="#fff" opacity=".8"/>
<!-- feet -->
<ellipse cx="96" cy="236" rx="18" ry="10" fill="#001123"/>
<ellipse cx="144" cy="236" rx="18" ry="10" fill="#001123"/>
<!-- arms -->
<path d="M60 130 C42 118 38 98 42 82" fill="#1f84f0" stroke="#001123" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="76" r="11" fill="#ffffff" stroke="#001123" stroke-width="3.5"/>
<path d="M180 130 C198 118 202 98 198 82" fill="#1f84f0" stroke="#001123" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="198" cy="76" r="11" fill="#ffffff" stroke="#001123" stroke-width="3.5"/>
<!-- body: the SafeShelf shield -->
<path d="M56 78a32 32 0 0 1 32-32h64a32 32 0 0 1 32 32v54c0 52-36 86-64 98-28-12-64-46-64-98z" fill="url(#body)" stroke="#001123" stroke-width="4" stroke-linejoin="round"/>
<path d="M70 82a20 20 0 0 1 20-20h22c-20 6-34 22-38 46z" fill="url(#shine)"/>
<!-- face panel -->
<rect x="74" y="78" width="92" height="66" rx="30" fill="url(#face)" stroke="#001123" stroke-width="3.5"/>
<path d="M93 110 Q102 98 111 110M129 110 Q138 98 147 110" fill="none" stroke="#001123" stroke-width="4.5" stroke-linecap="round"/>

<ellipse cx="88" cy="126" rx="7" ry="4.5" fill="#ff9fb8" opacity=".75"/><ellipse cx="152" cy="126" rx="7" ry="4.5" fill="#ff9fb8" opacity=".75"/>
<path d="M104 124 Q120 144 136 124 Z" fill="#001123"/><path d="M111 132 Q120 138 129 132" fill="#ff7a93"/>
<!-- chest badge: follows the verdict, so only a clear result ever shows a green tick -->
<circle cx="120" cy="178" r="17" fill="#a2f1a9" stroke="#001123" stroke-width="3.5"/>
<path d="m111.5 178 6 6 11-12" fill="none" stroke="#001123" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M24 40 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z M214 30 l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z M206 120 l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z" fill="#a2f1a9" stroke="#001123" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
